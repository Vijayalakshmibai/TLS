spring.application.name=TLSMonitor-Test

# Use H2 in PostgreSQL compatibility mode for test isolation
spring.datasource.url=jdbc:h2:mem:tls_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_UNTYPED=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

vaadin.launch-browser=false
