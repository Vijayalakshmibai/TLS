# ===================================================================
# Production Configuration Profile: application-prod.properties
# ===================================================================
spring.application.name=TLSMonitor-Production
server.port=${PORT:8085}

# Production PostgreSQL Connection (configure via environment variables in production)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tls_monitoring_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Production Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# Production JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Vaadin Production Mode
vaadin.productionMode=true
vaadin.launch-browser=false

# Actuator Endpoints (Production Health & Info)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Automated Monitoring Schedule (Defaults to daily at 08:00 AM UTC)
monitoring.schedule.cron=0 0 8 * * *

# Production Logging
logging.level.root=WARN
logging.level.com.tlsmonitor=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Gmail HTTPS relay (Apps Script Web App; SMTP is not used)
app.email.relay-url=${GMAIL_RELAY_URL:}
app.email.relay-secret=${GMAIL_RELAY_SECRET:}
app.alerts.report-recipient=vijayalakshmibai0686@gmail.com
