spring.application.name=TLSMonitor
server.port=${PORT:${SERVER_PORT:8085}}
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=TLS_SESSIONID
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true

# PostgreSQL Datasource configuration (environment variables with local defaults)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tls_monitoring_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Vaadin settings
vaadin.launch-browser=false
vaadin.productionMode=true

# Actuator settings
management.endpoints.web.exposure.include=health,info

# Application Logging
logging.level.com.tlsmonitor=INFO

# Gmail HTTPS relay (Apps Script Web App; SMTP is not used)
app.email.relay-url=${GMAIL_RELAY_URL:}
app.email.relay-secret=${GMAIL_RELAY_SECRET:}
app.alerts.report-recipient=vijayalakshmibai0686@gmail.com
